<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Screen 3</title>
<!-- Tailwind CSS CDN with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#121411',
              lime: '#D4F26A',
              muted: '#9EA398',
              surface: '#1A1E19',
              dark: '#111410',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Prevent default bounce and ensure smooth dark canvas */
    body {
      background-color: #0b0d0a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .progress-circle {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .neon-shadow {
      box-shadow: 0 10px 30px -4px rgba(212, 242, 106, 0.35);
    }
    .ring-glow {
      filter: drop-shadow(0 0 12px rgba(212, 242, 106, 0.45));
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 text-white antialiased selection:bg-[#D4F26A] selection:text-black">
<!-- BEGIN: MobileFrameContainer -->
<!-- Container replicating the Android viewport (~412px standard) -->
<div class="relative w-full max-w-[412px] h-[892px] max-h-screen bg-[#121411] overflow-hidden flex flex-col justify-between shadow-2xl md:rounded-[44px]" data-purpose="mobile-viewport">
<!-- BEGIN: VisualBackgroundSection -->
<!-- Out-of-focus metric artwork from screen 3 specifications with dark fade overlay -->
<div class="absolute inset-x-0 top-0 h-[60%] w-full overflow-hidden pointer-events-none" data-purpose="background-visual">
<img alt="Atmospheric fitness metric charts" class="w-full h-full object-cover object-top opacity-60 mix-blend-luminosity brightness-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAG9gE86_FipUT9_dKvfTXogmT8lsHMzmPA525tWGXdcEQtC9rCQsITJu2Od7dZMaZp5rARVrwwbpUR2ZdwA8yiY1ZzEGK5pjObk47aQA_AWrNZoLKW8VeXoijQYDCB6GGHONSQHrxZX_STu8JqmAiq3mQmwGg-awbFAXd8PAS0NcpXCFBUEvcJdTNkNKGhXg84DDdAvRjxWFwP4YQvuVITQTAhC8Hp4M4fYUKRwzyEzqickxi1N9n8" style="content: url('https://lh3.googleusercontent.com/aida/AEtjO1UpT1wXr76YbYJ4rVN8JoLuO2vQly758HXGybZZloIM0ibSySZKpiBwR5BSjNhnJf-Z10-HdFFHR6nxNVUaIDiwscleYMtFWwmci0BiymfYEg4WxXGGaR75hU9C-PhL_9Qi8w626MLdhOy0t1pD7gq4f3-lvjYxRdxfwVRumFnDjRBplYP_uXb9a6cdmpU47Ar9J_Pw-T-MlQMPysRoe7PNwotigevdP6MLUuEZqPTMWr_ESG1Ry9S07xQ');"/>
<!-- Vertical gradient fading photo seamlessly into #121411 base background -->
<div class="absolute inset-0 bg-gradient-to-b from-[#121411]/40 via-[#121411]/60 to-[#121411]"></div>
<!-- Radial vignette for localized depth -->
<div class="absolute inset-0 bg-radial from-transparent via-[#121411]/40 to-[#121411]"></div>
</div>
<!-- END: VisualBackgroundSection -->
<!-- BEGIN: TopBarAndProgressVisual -->
<div class="relative z-10 flex flex-col w-full">
<!-- BEGIN: AndroidStatusBar -->
<div class="flex items-center justify-between px-6 pt-3 pb-2 text-sm font-medium tracking-tight text-white/95" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center gap-1.5 opacity-90">
<!-- Cellular Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.55-.5 2.98-1.35 4.14L12 19.64l-5.65-3.5C5.5 14.98 5 13.55 5 12c0-3.87 3.13-7 7-7z" opacity="0"></path>
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-5h3v17h-3V4z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.55 0 6.77 1.41 9.15 3.7L12 19.35 2.85 11.2C5.23 8.91 8.45 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-white/80 rounded-sm p-[1px] flex items-center">
<div class="w-full h-full bg-white rounded-2xs"></div>
</div>
</div>
</div>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: NavigationHeader -->
<nav class="flex items-center justify-between px-6 pt-3" data-purpose="top-navigation">
<!-- Back Navigation Button -->
<button aria-label="Go Back" class="w-10 h-10 rounded-full bg-[#1e231c]/70 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 transition hover:bg-white/10" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7"></path>
</svg>
</button>
<!-- Intentionally no Skip button on Screen 3 -->
<div class="w-10 h-10 pointer-events-none"></div>
</nav>
<!-- END: NavigationHeader -->
<!-- BEGIN: CircularGoalVisual -->
<!-- Centered glowing 70% progress ring overlay -->
<div class="flex items-center justify-center pt-8 pb-4" data-purpose="progress-ring-card">
<div class="relative flex items-center justify-center">
<!-- Ambient Ring Aura -->
<div class="absolute w-44 h-44 rounded-full bg-[#D4F26A]/10 blur-2xl pointer-events-none"></div>
<!-- SVG Circular Track & Progress Ring -->
<svg class="w-56 h-56 progress-circle ring-glow" viewbox="0 0 200 200">
<!-- Background base track -->
<circle cx="100" cy="100" fill="transparent" r="78" stroke="#242b20" stroke-width="12"></circle>
<!-- 70% completed kinetic lime progress arc (Circumference ~ 490px, offset ~ 147px) -->
<circle cx="100" cy="100" fill="transparent" r="78" stroke="#D4F26A" stroke-dasharray="490.08" stroke-dashoffset="147" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Inside Text Details -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="text-[36px] font-extrabold tracking-tight text-white leading-none">50 km</span>
<span class="text-[11px] font-bold tracking-widest text-[#D4F26A] uppercase mt-2">Monthly Goal</span>
</div>
</div>
</div>
<!-- END: CircularGoalVisual -->
</div>
<!-- END: TopBarAndProgressVisual -->
<!-- BEGIN: BottomContentSection -->
<div class="relative z-10 px-6 pb-6 pt-2 flex flex-col justify-end" data-purpose="bottom-interaction-panel">
<!-- Headline & Subtitle -->
<div class="space-y-3 mb-8">
<h1 class="text-[34px] leading-[1.12] font-bold tracking-tight text-white">
          Set goals.<br/>See progress.
        </h1>
<p class="text-[15px] leading-relaxed text-[#9EA398] font-normal max-w-[320px]">
          Track personal records and weekly trends, and watch every session add up.
        </p>
</div>
<!-- Pagination Indicators: Screen 3 active (two dots, third active kinetic pill) -->
<div class="flex items-center gap-2 mb-6" data-purpose="carousel-indicators">
<!-- Screen 1 indicator -->
<span class="w-2 h-2 rounded-full bg-white/20"></span>
<!-- Screen 2 indicator -->
<span class="w-2 h-2 rounded-full bg-white/20"></span>
<!-- Screen 3 indicator: active lime pill -->
<span class="w-7 h-2 rounded-full bg-[#D4F26A]"></span>
</div>
<!-- Call to Actions -->
<div class="flex flex-col gap-3.5 items-center">
<!-- Primary CTA: "Get started" -->
<button class="w-full h-14 bg-[#D4F26A] hover:bg-[#c9ea5a] active:scale-[0.985] transition-all text-[#111410] font-bold text-base rounded-full flex items-center justify-center neon-shadow tracking-tight" data-purpose="primary-action-button" type="button">
          Get started
        </button>
<!-- Secondary CTA: "I already have an account" -->
<button class="py-1 text-sm text-[#9EA398] hover:text-white transition active:opacity-75" data-purpose="login-link-button" type="button">
          I already have <span class="font-bold text-white">an account</span>
</button>
</div>
<!-- BEGIN: AndroidGestureIndicator -->
<div class="flex justify-center pt-5 pb-1" data-purpose="home-indicator">
<div class="w-32 h-1 bg-white/25 rounded-full"></div>
</div>
<!-- END: AndroidGestureIndicator -->
</div>
<!-- END: BottomContentSection -->
</div>
<!-- END: MobileFrameContainer -->
</body></html>

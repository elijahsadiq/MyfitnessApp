<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Permission</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              lime: '#D4F26A',
              dark: '#121411',
              charcoal: '#1C1F1A',
              cardBorder: 'rgba(255, 255, 255, 0.07)',
              muted: '#9EA398',
              textDark: '#111410',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121411;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-[#121411] text-white flex flex-col justify-between min-h-screen w-full max-w-md mx-auto select-none relative overflow-hidden">

  <!-- Android Status Bar -->
  

  <!-- Ambient glowing spotlight in background -->
  <div class="absolute top-16 left-1/2 -translate-x-1/2 w-72 h-72 bg-[#D4F26A] opacity-[0.045] rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Scrollable / Centered Body Content -->
  <main class="flex-1 flex flex-col justify-center px-6 py-4 z-10">
    
    <!-- Hero Icon Tile -->
    <div class="flex justify-center mb-7">
      <div class="relative w-24 h-24 rounded-[28px] bg-[#D4F26A] flex items-center justify-center shadow-[0_12px_32px_rgba(212,242,106,0.22)] ring-1 ring-[#D4F26A]/30">
        <!-- Subtle pulsing / glow halo -->
        <div class="absolute inset-0 rounded-[28px] bg-white/20 opacity-0 hover:opacity-100 transition-opacity"></div>
        <!-- Dark Location-Pin Icon -->
        <svg class="w-11 h-11 text-[#111410]" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"></path>
        </svg>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="text-center mb-8">
      <h1 class="text-[28px] leading-[1.2] font-bold text-white tracking-tight mb-3">
        Track your runs</h1>
      <p class="text-[15px] leading-relaxed text-[#9EA398] px-1 font-normal">
        My Fitness App uses your location while a workout is active to map your route and measure distance and pace.
      </p>
    </div>

    <!-- Feature Permissions Card -->
    <div class="bg-[#1C1F1A] border border-white/[0.06] rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
      
      <!-- Row 1: Only while running -->
      <div class="flex items-start space-x-3.5">
        <div class="w-7 h-7 rounded-lg bg-[#121411] border border-[#D4F26A]/30 flex items-center justify-center shrink-0 mt-0.5 text-[#D4F26A]">
          <!-- Timer / Active Workout Icon -->
          <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15 15"></polyline>
          </svg>
        </div>
        <p class="text-[14px] leading-snug font-medium text-white/90 pt-1">
          Only while a workout is running
        </p>
      </div>

      <!-- Row 2: Route stays on device -->
      <div class="flex items-start space-x-3.5">
        <div class="w-7 h-7 rounded-lg bg-[#121411] border border-[#D4F26A]/30 flex items-center justify-center shrink-0 mt-0.5 text-[#D4F26A]">
          <!-- Shield / Device Privacy Icon -->
          <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <p class="text-[14px] leading-snug font-medium text-white/90 pt-1">
          Your route stays on your device until you save it
        </p>
      </div>

      <!-- Row 3: Turn off anytime -->
      <div class="flex items-start space-x-3.5">
        <div class="w-7 h-7 rounded-lg bg-[#121411] border border-[#D4F26A]/30 flex items-center justify-center shrink-0 mt-0.5 text-[#D4F26A]">
          <!-- Sliders / Settings Toggle Icon -->
          <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="9" cy="7" r="3"></circle>
            <circle cx="15" cy="17" r="3"></circle>
            <path d="M3 7h3m6 0h9M3 17h9m6 0h3"></path>
          </svg>
        </div>
        <p class="text-[14px] leading-snug font-medium text-white/90 pt-1">
          You can turn this off any time in Profile
        </p>
      </div>

    </div>

  </main>

  <!-- Bottom Actions -->
  <footer class="w-full px-6 pb-4 pt-2 z-20 shrink-0 flex flex-col items-center">
    <!-- Primary CTA: Allow Location -->
    <button class="w-full h-14 bg-[#D4F26A] hover:bg-[#c6e65b] active:scale-[0.98] transition-all duration-150 rounded-full flex items-center justify-center text-[#111410] font-bold text-base shadow-[0_8px_24px_rgba(212,242,106,0.25)] mb-3 cursor-pointer">
      Allow location
    </button>

    <!-- Secondary Text CTA: Not Now -->
    <button class="h-10 px-6 text-[#9EA398] hover:text-white active:scale-[0.97] transition text-sm font-semibold tracking-wide flex items-center justify-center cursor-pointer mb-2">
      Not now
    </button>

    <!-- Native Android Home Navigation Bar Pill -->
    <div class="w-32 h-1 bg-white/30 rounded-full mt-1"></div>
  </footer>




</body></html>

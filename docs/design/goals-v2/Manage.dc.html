<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#111410}a:hover{color:#3A3F36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111410; position: relative; overflow: hidden">

<div aria-hidden="true" style="box-sizing: border-box; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7066">3 active · 1 completed</span>
<span style="font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Goals</span>
</div>
<span style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #D4F26A; font-size: 14px; font-weight: 700">+ New goal</span>
</div>
<div style="height: 250px; border-radius: 26px; background: #1C1F1A; padding: 20px; box-sizing: border-box; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 19px; font-weight: 700">Run 50 km in 30 days</span>
<span style="font-size: 46px; font-weight: 800">32</span>
</div>
<div style="height: 98px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E6E0"></div>
</div>

<a href="Main.dc.html" aria-label="Close and return to goals" style="position: absolute; inset: 0; background: rgba(17, 20, 16, 0.55)"></a>

<section aria-label="Manage goal" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 28px; border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D3D6CD"></span>

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: #F1F3EC; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Ride 100 km in 30 days</h2>
<span style="font-size: 13px; color: #6B7066">Cycling · Distance · started Thu 24 Sep</span>
</div>
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #F1F3EC; display: flex; align-items: center; justify-content: center; color: #111410; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; color: #6B7066"><span style="font-size: 26px; font-weight: 800; color: #111410">58</span> of 100 km</span>
<span style="font-size: 15px; font-weight: 800">58%</span>
</div>
<span style="display: block; height: 10px; border-radius: 999px; background: #ECEEE7; overflow: hidden"><span style="display: block; width: 58%; height: 100%; border-radius: 999px; background: #C6E85A"></span></span></div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; background: #F5F6F2">
<span style="font-size: 12px; color: #6B7066">Avg per day</span>
<span style="font-size: 16px; font-weight: 800">4.8 km</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; background: #F5F6F2">
<span style="font-size: 12px; color: #6B7066">Needed per day</span>
<span style="font-size: 16px; font-weight: 800">2.3 km</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; background: #F5F6F2">
<span style="font-size: 12px; color: #6B7066">Rides logged</span>
<span style="font-size: 16px; font-weight: 800">9</span>
</div>
</div>

<div style="display: flex; flex-direction: column; border-radius: 20px; border: 1px solid #E4E6E0; overflow: hidden">
<a href="NewGoal.dc.html" style="display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; color: #111410; text-decoration: none; border-bottom: 1px solid #E4E6E0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
<span style="flex: 1; font-size: 15px; font-weight: 600">Edit goal</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7066" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
</a>
<button type="button" style="display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; background: #FFFFFF; border: 0; border-bottom: 1px solid #E4E6E0; font: inherit; color: #111410; text-align: left; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg>
<span style="flex: 1; font-size: 15px; font-weight: 600">Make main goal</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; background: #FFFFFF; border: 0; border-bottom: 1px solid #E4E6E0; font: inherit; color: #111410; text-align: left; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"></path></svg>
<span style="flex: 1; font-size: 15px; font-weight: 600">Add 7 more days</span>
</button>
<a href="DeleteConfirm.dc.html" style="display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; color: #B42318; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
<span style="flex: 1; font-size: 15px; font-weight: 700">Delete goal</span>
</a>
</div>
</section>
</div>

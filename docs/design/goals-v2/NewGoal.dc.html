<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#111410}a:hover{color:#3A3F36}
</style>
</helmet>
<div style="width: 390px; height: 1160px; box-sizing: border-box; background: #F5F6F2; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111410; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; height: 68px; padding: 12px 12px 0; box-sizing: border-box">
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #111410; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">New goal</h1>
<span style="width: 44px; height: 44px"></span>
</header>

<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 26px">

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Choose an activity</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" aria-pressed="{{runPressed}}" onClick="{{pickRun}}" style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; height: 84px; padding: 14px; border-radius: 20px; box-sizing: border-box; font: inherit; text-align: left; cursor: pointer; {{runTile}}">
<span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; {{runIcon}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="4.5" r="2"></circle><path d="M8.5 20.5l2.5-5 3 2.5v4"></path><path d="M11 15.5l1.5-6"></path><path d="M12.5 9.5l-3.5 1-2 3"></path><path d="M12.5 9.5l2.5 3 3.5 1"></path></svg></span>
<span style="font-size: 15px; font-weight: 700">Running</span>
</button>
<button type="button" aria-pressed="{{ridePressed}}" onClick="{{pickRide}}" style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; height: 84px; padding: 14px; border-radius: 20px; box-sizing: border-box; font: inherit; text-align: left; cursor: pointer; {{rideTile}}">
<span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; {{rideIcon}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg></span>
<span style="font-size: 15px; font-weight: 700">Cycling</span>
</button>
<button type="button" aria-pressed="{{liftPressed}}" onClick="{{pickLift}}" style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; height: 84px; padding: 14px; border-radius: 20px; box-sizing: border-box; font: inherit; text-align: left; cursor: pointer; {{liftTile}}">
<span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; {{liftIcon}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="m21.5 21.5-1.4-1.4"></path><path d="M3.9 3.9 2.5 2.5"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></svg></span>
<span style="font-size: 15px; font-weight: 700">Workout</span>
</button>
<button type="button" aria-pressed="{{anyPressed}}" onClick="{{pickAny}}" style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; height: 84px; padding: 14px; border-radius: 20px; box-sizing: border-box; font: inherit; text-align: left; cursor: pointer; {{anyTile}}">
<span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; {{anyIcon}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span>
<span style="font-size: 15px; font-weight: 700">Any activity</span>
</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">What do you want to track?</h2>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #6B7066">{{metricHint}}</p>
<div style="display: flex; flex-wrap: nowrap; gap: 8px; padding-top: 4px">
<sc-for list="{{metrics}}" as="m" hint-placeholder-count="3">
<button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="flex: 1 1 0; min-width: 0; height: 58px; padding: 0 8px; border-radius: 18px; box-sizing: border-box; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; {{m.style}}"><span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{m.label}}</span><span style="font-size: 12px; font-weight: 500; opacity: 0.72; white-space: nowrap">{{m.unit}}</span></button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Set your target</h2>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E4E6E0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" aria-label="Decrease target" onClick="{{decTarget}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; border: 1px solid #D3D6CD; background: #FFFFFF; color: #111410; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<div aria-live="polite" style="display: flex; align-items: baseline; justify-content: center; gap: 8px; min-width: 0">
<span style="font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">{{targetText}}</span>
<span style="font-size: 16px; font-weight: 600; color: #6B7066">{{unitText}}</span>
</div>
<button type="button" aria-label="Increase target" onClick="{{incTarget}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; border: 0; background: #111410; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">How many days?</h2>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E4E6E0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" aria-label="Fewer days" onClick="{{decDays}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; border: 1px solid #D3D6CD; background: #FFFFFF; color: #111410; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<div aria-live="polite" style="display: flex; align-items: baseline; justify-content: center; gap: 8px">
<span style="font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">{{days}}</span>
<span style="font-size: 16px; font-weight: 600; color: #6B7066">{{daysUnit}}</span>
</div>
<button type="button" aria-label="More days" onClick="{{incDays}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; border: 0; background: #111410; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #6B7066">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
<span>Starts today · ends {{endsText}}</span>
</div>
</div>
</section>

<section aria-label="Goal summary" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 24px; background: #1C1F1A; color: #FFFFFF">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B4B9AE">Your goal</span>
<span style="font-size: 21px; font-weight: 700; line-height: 1.25">{{summaryTitle}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 16px; background: #2A2E27">
<span style="font-size: 12px; color: #B4B9AE">{{paceLabel}}</span>
<span style="font-size: 17px; font-weight: 800; color: #D4F26A">{{paceValue}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 16px; background: #2A2E27">
<span style="font-size: 12px; color: #B4B9AE">Deadline</span>
<span style="font-size: 17px; font-weight: 800; color: #D4F26A">{{endsText}}</span>
</div>
</div>
</section>

</div>

<footer style="margin-top: auto; padding: 20px 20px 28px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 999px; background: #D4F26A; color: #111410; font-size: 16px; font-weight: 800; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
Create goal
</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
var s = Object.assign({ activity: 'run', metric: 'distance', target: 50, days: 30 }, this.state || {});
var self = this;

var METRICS = {
distance: { label: 'Distance', unit: 'km', step: 5, min: 1, max: 1000, def: 50, presets: [10, 25, 50, 100] },
time: { label: 'Time', unit: 'min', step: 15, min: 15, max: 10000, def: 150, presets: [60, 150, 300, 600] },
sessions: { label: 'Sessions', unit: 'count', step: 1, min: 1, max: 100, def: 4, presets: [3, 4, 8, 12] },
volume: { label: 'Weight', unit: 'kg', step: 1000, min: 1000, max: 500000, def: 10000, presets: [5000, 10000, 20000, 40000] }
};
var ALLOWED = {
run: ['distance', 'time', 'sessions'],
ride: ['distance', 'time', 'sessions'],
lift: ['time', 'sessions', 'volume'],
any: ['time', 'sessions']
};
var HINTS = {
run: 'Track how far, how long or how often you run.',
ride: 'Track how far, how long or how often you ride.',
lift: 'Workouts are tracked by time, sessions or total weight lifted.',
any: 'Counts every workout, whatever the activity.'
};
var SESSION_WORD = { run: ['run', 'runs'], ride: ['ride', 'rides'], lift: ['workout', 'workouts'], any: ['session', 'sessions'] };

var fmt = function (n) { return Number(n).toLocaleString('en-US'); };
var m = METRICS[s.metric];

var pickActivity = function (a) {
var allowed = ALLOWED[a];
var metric = allowed.indexOf(s.metric) >= 0 ? s.metric : allowed[0];
var target = metric === s.metric ? s.target : METRICS[metric].def;
self.setState({ activity: a, metric: metric, target: target });
};

var tileOn = 'background: #121411; color: #FFFFFF; border: 1px solid #121411';
var tileOff = 'background: #FFFFFF; color: #111410; border: 1px solid #E4E6E0';
var iconOn = 'background: #D4F26A; color: #111410';
var iconOff = 'background: #F1F3EC; color: #111410';
var pillOn = 'background: #111410; color: #FFFFFF; border: 1px solid #111410';
var pillOff = 'background: #FFFFFF; color: #111410; border: 1px solid #E4E6E0';

var t = s.target;
var d = s.days;
var sw = SESSION_WORD[s.activity];

var unitText = m.unit;
if (s.metric === 'sessions') unitText = t === 1 ? sw[0] : sw[1];

var verbs = { run: 'Run', ride: 'Ride', lift: 'Train', any: 'Be active' };
var dayWord = d === 1 ? 'day' : 'days';
var summaryTitle;
if (s.metric === 'distance') summaryTitle = verbs[s.activity] + ' ' + fmt(t) + ' km in ' + d + ' ' + dayWord;
else if (s.metric === 'time') summaryTitle = verbs[s.activity] + ' for ' + fmt(t) + ' min in ' + d + ' ' + dayWord;
else if (s.metric === 'volume') summaryTitle = 'Lift ' + fmt(t) + ' kg in ' + d + ' ' + dayWord;
else summaryTitle = fmt(t) + ' ' + unitText + ' in ' + d + ' ' + dayWord;

var paceLabel = 'Per day';
var paceValue;
if (s.metric === 'distance') paceValue = (t / d).toFixed(1) + ' km';
else if (s.metric === 'time') paceValue = Math.max(1, Math.round(t / d)) + ' min';
else if (s.metric === 'volume') paceValue = fmt(Math.round(t / d)) + ' kg';
else { paceLabel = 'Per week'; paceValue = (t / d * 7).toFixed(1) + ' ' + sw[1]; }

var end = new Date();
end.setDate(end.getDate() + d);
var endsText = end.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };

return {
runTile: s.activity === 'run' ? tileOn : tileOff,
rideTile: s.activity === 'ride' ? tileOn : tileOff,
liftTile: s.activity === 'lift' ? tileOn : tileOff,
anyTile: s.activity === 'any' ? tileOn : tileOff,
runIcon: s.activity === 'run' ? iconOn : iconOff,
rideIcon: s.activity === 'ride' ? iconOn : iconOff,
liftIcon: s.activity === 'lift' ? iconOn : iconOff,
anyIcon: s.activity === 'any' ? iconOn : iconOff,
runPressed: s.activity === 'run',
ridePressed: s.activity === 'ride',
liftPressed: s.activity === 'lift',
anyPressed: s.activity === 'any',
pickRun: function () { pickActivity('run'); },
pickRide: function () { pickActivity('ride'); },
pickLift: function () { pickActivity('lift'); },
pickAny: function () { pickActivity('any'); },

metricHint: HINTS[s.activity],
metrics: ALLOWED[s.activity].map(function (key) {
var mm = METRICS[key];
return {
label: mm.label,
unit: key === 'sessions' ? sw[1] : mm.unit,
pressed: key === s.metric,
style: key === s.metric ? pillOn : pillOff,
pick: function () { self.setState({ metric: key, target: key === s.metric ? s.target : mm.def }); }
};
}),

targetText: fmt(t),
unitText: unitText,
decTarget: function () { self.setState({ target: clamp(t - m.step, m.min, m.max) }); },
incTarget: function () { self.setState({ target: clamp(t + m.step, m.min, m.max) }); },

days: d,
daysUnit: dayWord,
decDays: function () { self.setState({ days: clamp(d - 1, 1, 365) }); },
incDays: function () { self.setState({ days: clamp(d + 1, 1, 365) }); },
endsText: endsText,

summaryTitle: summaryTitle,
paceLabel: paceLabel,
paceValue: paceValue
};
}
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Onboarding - Screen 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              lime: '#D4F26A',
              dark: '#121411',
              charcoal: '#1E211C',
              muted: '#9EA398',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121411;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#121411] text-white flex justify-center min-h-screen select-none antialiased">
  <!-- Mobile Container (Android viewport) -->
  <div class="relative w-full max-w-[412px] h-[892px] bg-[#121411] overflow-hidden flex flex-col justify-between shadow-2xl">
    
    <!-- Top 2/3: Abstract Visual Area -->
    <div class="absolute inset-x-0 top-0 h-[62%] overflow-hidden pointer-events-none">
      <!-- Soft out-of-focus background image with rising bars/graphs -->
      <img 
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBf3P2Y_7lE_-gXvmSKNMp8JQYTz0gk3cgTGh1Rl_Ng7JCn1BFsjZKIzhp0KXnb3B6KgFIGfasuwfPXGPrTh7sVODeVyhe7xxOMNkZYcE5wAkO-jZ-XEWZ8aQjQTYV9TO2a5wmz4EIqvciflIVtlI1ajBPMurY8S2Hua87Io3fwRcDbc-cb-Dd3Jc46yKIlSCy8ECrkyMRcaqznQNHTuXYopMOwT7x16fhFgVZHmQ2Trj0WGzg-kRgK" 
        alt="Abstract dark fitness metrics background" 
        class="w-full h-full object-cover object-center opacity-65 scale-105 filter blur-[1px]"
      />
      
      <!-- Multi-stop Dark Vignette & Fade to #121411 -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#121411] via-[#121411]/85 via-45% to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-[#121411]/60 via-transparent to-transparent"></div>
      
      <!-- Ambient Glow Behind Ring -->
      <div class="absolute top-[48%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full bg-[#D4F26A]/10 blur-3xl"></div>

      <!-- Large Progress Ring (70%) with "50 km" at center -->
      <div class="absolute top-[50%] left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center">
        <div class="relative w-[210px] h-[210px] flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
            <!-- Track Circle -->
            <circle
              cx="60"
              cy="60"
              r="50"
              stroke="#242921"
              stroke-width="9"
              fill="rgba(18, 20, 17, 0.55)"
              class="backdrop-blur-sm"
            />
            <!-- Progress Arc: ~70% of 314.16 = 220 stroke-dasharray -->
            <circle
              cx="60"
              cy="60"
              r="50"
              stroke="#D4F26A"
              stroke-width="9"
              stroke-linecap="round"
              fill="transparent"
              stroke-dasharray="314.16"
              stroke-dashoffset="94.2"
              class="drop-shadow-[0_0_12px_rgba(212,242,106,0.45)]"
            />
          </svg>

          <!-- Center Content: "50 km" -->
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span class="text-[34px] font-extrabold tracking-tight text-white leading-none">50 km</span>
            <span class="text-xs font-semibold uppercase tracking-wider text-brand-lime mt-1.5 opacity-90">Monthly Goal</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Status Bar (Android native overlay) -->
    <div class="relative z-20 flex justify-between items-center px-6 pt-3 text-sm font-medium tracking-tight text-white/90">
      <span class="font-semibold text-xs tracking-normal">9:41</span>
      <div class="flex items-center space-x-2 text-white/90">
        <span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-[16px]">wifi</span>
        <span class="material-symbols-outlined text-[16px] rotate-90">battery_full</span>
      </div>
    </div>

    <!-- Top Navigation Row: Circular Charcoal Back Button (No Skip on screen 3) -->
    <div class="relative z-20 flex justify-between items-center px-6 pt-3">
      <button 
        aria-label="Back" 
        class="w-10 h-10 rounded-full bg-[#1E211C]/80 border border-white/10 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-all shadow-sm">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </button>
      <!-- Explicitly empty spacer replacing Skip button to keep spacing exact -->
      <div class="w-10 h-10"></div>
    </div>

    <!-- Spacer for upper visual balance -->
    <div class="flex-1"></div>

    <!-- Bottom Section: Content, Indicators, and CTAs -->
    <div class="relative z-20 px-6 pb-4 flex flex-col">
      <!-- Headline & Subtitle -->
      <div class="mb-8">
        <h1 class="text-[32px] leading-[1.18] font-extrabold tracking-tight text-white mb-3">
          Set goals.<br>See progress.
        </h1>
        <p class="text-[15px] leading-relaxed text-[#9EA398] max-w-[340px]">
          Track personal records and weekly trends, and watch every session add up.
        </p>
      </div>

      <!-- Page-Indicator Dots (Third dot active lime pill) -->
      <div class="flex items-center gap-1.5 mb-7" aria-label="Page 3 of 3">
        <div class="w-2 h-2 rounded-full bg-white/20 transition-all"></div>
        <div class="w-2 h-2 rounded-full bg-white/20 transition-all"></div>
        <div class="w-6 h-2 rounded-full bg-[#D4F26A] transition-all"></div>
      </div>

      <!-- CTA Buttons Group -->
      <div class="flex flex-col items-center gap-3.5 mb-2">
        <!-- Full-width lime pill button: "Get started" -->
        <button class="w-full h-14 bg-[#D4F26A] hover:bg-[#cbf056] active:scale-[0.99] text-[#111410] font-bold text-base rounded-full flex items-center justify-center transition-all shadow-[0_4px_20px_rgba(212,242,106,0.25)]">
          Get started
        </button>

        <!-- Secondary Text Button: "I already have an account" -->
        <button class="py-2 px-4 text-sm text-white/90 hover:text-white transition-colors">
          I already have <span class="font-bold text-white">an account</span>
        </button>
      </div>

      <!-- Android Home Navigation Gesture Bar -->
      <div class="w-full flex justify-center pt-2 pb-1">
        <div class="w-36 h-1 bg-white/25 rounded-full"></div>
      </div>
    </div>

  </div>
</body>
</html>

<!DOCTYPE html><html lang="en" style="width: 1113px; height: 998px; overflow: hidden; position: relative;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Detail - Morning Run</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#d4f26a',
            'brand-dark': '#111410',
            'surface-bg': '#f9faf6',
            'surface-card': '#ffffff',
            'surface-subtle': '#f3f4f0',
            'muted-text': '#72786d',
            'outline-border': '#e5e7e1'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#f9faf6] text-[#111410] flex justify-center min-h-screen">
  <!-- Mobile Container (approx 390-412px wide standard Android/iOS shell) -->
  <div class="w-full max-w-[412px] bg-[#f9faf6] min-h-screen flex flex-col relative pb-8 select-none">
    
    <!-- Android Status Bar -->
    <div class="w-full px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-[#111410] tracking-tight">
      <span class="">9:41</span>
      <div class="flex items-center space-x-2">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A9.957 9.957 0 0 1 2 12C2 6.48 6.48 2 12 2s10 4.48 10 10c0 2.32-.8 4.45-2.14 6.16l-.62-.62A8.96 8.96 0 0 0 21 12c0-4.97-4.03-9-9-9z"></path>
          <path d="M12 6a6 6 0 0 0-6 6c0 1.48.54 2.83 1.43 3.87l.71-.71A4.986 4.986 0 0 1 7 12c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.22-.44 2.33-1.17 3.19l.71.71A5.98 5.98 0 0 0 18 12a6 6 0 0 0-6-6z"></path>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path>
        </svg>
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M17 4h-3V2h-4v2H7v18h10V4z"></path>
        </svg>
      </div>
    </div>

    <!-- Top App Bar -->
    <header class="px-5 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/5 active:bg-black/10 transition-colors -ml-1.5" aria-label="Go back">
          <svg class="w-6 h-6 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div>
          <h1 class="text-xl font-extrabold text-[#111410] tracking-tight">Morning run</h1>
          <p class="text-xs text-[#72786d] font-medium">Today, 22 May · 06:45 AM</p>
        </div>
      </div>
      <div class="flex items-center space-x-1">
        <!-- Share button -->
        <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/5 active:bg-black/10 transition-colors" aria-label="Share workout">
          <svg class="w-5 h-5 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
        <!-- Overflow menu -->
        <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/5 active:bg-black/10 transition-colors" aria-label="More options">
          <svg class="w-5 h-5 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="1.5"></circle>
            <circle cx="12" cy="5" r="1.5"></circle>
            <circle cx="12" cy="19" r="1.5"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Content Scroll Container -->
    <main class="flex-1 px-5 space-y-5 pt-1">

      <!-- 200dp-tall Rounded Map Card -->
      <section class="relative w-full h-[200px] rounded-[24px] overflow-hidden shadow-sm border border-[#e5e7e1] bg-[#1a1c18] group">
        <!-- Generated dark GPS route map -->
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD357Q4Hp7JLAtYnRj93bgorlhU05EWnRrLGnWeLZUJ11VSmh5qSIhb1RVHQnDex08-mJLkK8ozZwUEMIpc4tmxV-85IH4PM8JPr57e6gmOYNMbNEWvv9yps3YGHsKVf7XLO4RtUIf7vamQScqdU3vlyPj5vhobGN_IjjEAVfWlTvYdZqY9uS3LxKx4z3cuajDHfUKia1X02MEf1iY4FSJ4HEAzMqXRb6_0g1t3xu_waT86EUUEQSh8" alt="Running GPS Route Map" class="w-full h-full object-cover object-center">

        <!-- Overlay Floating Badges on Map -->
        <div class="absolute top-3 left-3 bg-[#111410]/85 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center space-x-1.5 border border-white/10 text-white">
          <span class="w-2 h-2 rounded-full bg-[#d4f26a] animate-pulse"></span>
          <span class="text-[11px] font-bold tracking-wide uppercase">Riverside Loop</span>
        </div>

        <div class="absolute bottom-3 right-3 bg-[#111410]/85 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center space-x-1 text-white border border-white/10">
          <svg class="w-3.5 h-3.5 text-[#d4f26a]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path>
          </svg>
          <span class="text-[11px] font-semibold">10.12 km outdoor</span>
        </div>
      </section>

      <!-- 2x3 Grid of Stat Tiles on White Cards -->
      <section>
        <div class="grid grid-cols-2 gap-3">
          
          <!-- Distance -->
          <div class="bg-white rounded-2xl p-4 border border-[#e5e7e1] shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-semibold uppercase tracking-wider text-[#72786d]">Distance</span>
              <div class="w-7 h-7 rounded-lg bg-[#d4f26a]/30 flex items-center justify-center">
                <svg class="w-4 h-4 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
            </div>
            <div class="mt-1">
              <span class="text-2xl font-extrabold text-[#111410] tracking-tight">10.12</span>
              <span class="text-sm font-semibold text-[#72786d] ml-1">km</span>
            </div>
          </div>

          <!-- Duration -->
          <div class="bg-white rounded-2xl p-4 border border-[#e5e7e1] shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-semibold uppercase tracking-wider text-[#72786d]">Duration</span>
              <div class="w-7 h-7 rounded-lg bg-[#f3f4f0] flex items-center justify-center">
                <svg class="w-4 h-4 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="9"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </div>
            </div>
            <div class="mt-1">
              <span class="text-2xl font-extrabold text-[#111410] tracking-tight">57:23</span>
              <span class="text-sm font-semibold text-[#72786d] ml-1">min</span>
            </div>
          </div>

          <!-- Avg Pace -->
          <div class="bg-white rounded-2xl p-4 border border-[#e5e7e1] shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-semibold uppercase tracking-wider text-[#72786d]">Avg pace</span>
              <div class="w-7 h-7 rounded-lg bg-[#d4f26a]/30 flex items-center justify-center">
                <svg class="w-4 h-4 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
            </div>
            <div class="mt-1">
              <span class="text-2xl font-extrabold text-[#111410] tracking-tight">5:40</span>
              <span class="text-sm font-semibold text-[#72786d] ml-1">/km</span>
            </div>
          </div>

          <!-- Avg Speed -->
          <div class="bg-white rounded-2xl p-4 border border-[#e5e7e1] shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-semibold uppercase tracking-wider text-[#72786d]">Avg speed</span>
              <div class="w-7 h-7 rounded-lg bg-[#f3f4f0] flex items-center justify-center">
                <svg class="w-4 h-4 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
              </div>
            </div>
            <div class="mt-1">
              <span class="text-2xl font-extrabold text-[#111410] tracking-tight">10.6</span>
              <span class="text-sm font-semibold text-[#72786d] ml-1">km/h</span>
            </div>
          </div>

          <!-- Calories -->
          <div class="bg-white rounded-2xl p-4 border border-[#e5e7e1] shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-semibold uppercase tracking-wider text-[#72786d]">Calories</span>
              <div class="w-7 h-7 rounded-lg bg-[#f3f4f0] flex items-center justify-center">
                <svg class="w-4 h-4 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                </svg>
              </div>
            </div>
            <div class="mt-1">
              <span class="text-2xl font-extrabold text-[#111410] tracking-tight">642</span>
              <span class="text-sm font-semibold text-[#72786d] ml-1">kcal</span>
            </div>
          </div>

          <!-- Elevation -->
          <div class="bg-white rounded-2xl p-4 border border-[#e5e7e1] shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-semibold uppercase tracking-wider text-[#72786d]">Elevation</span>
              <div class="w-7 h-7 rounded-lg bg-[#f3f4f0] flex items-center justify-center">
                <svg class="w-4 h-4 text-[#111410]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 01-2.5-2.5z" class="hidden"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 7h4v4"></path>
                </svg>
              </div>
            </div>
            <div class="mt-1">
              <span class="text-2xl font-extrabold text-[#111410] tracking-tight">+84</span>
              <span class="text-sm font-semibold text-[#72786d] ml-1">m</span>
            </div>
          </div>

        </div>
      </section>

      <!-- Splits Section -->
      

      <!-- Notes Card at the Bottom -->
      

    </main>

    <!-- Bottom Gesture Pill -->
    <div class="w-full flex justify-center py-2 mt-4">
      <div class="w-32 h-1 bg-[#111410]/20 rounded-full"></div>
    </div>

  </div>




<div id="snapdom-sandbox" data-snapdom-sandbox="true" aria-hidden="true" style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div></body></html>

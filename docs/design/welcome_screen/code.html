<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>My Fitness App - Onboarding</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#121411',
              primary: '#D4F26A',
              textMuted: '#8E9489',
              textSubtle: '#9EA399',
              dotInactive: '#2A2E27',
              darkIcon: '#111410',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Precise Gradient and Viewport Handling -->
<style data-purpose="layout-styles">
    body {
      background-color: #0b0c0a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen framing wrapper for accurate mobile proportion */
    .mobile-frame {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 915px;
      background-color: #121411;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Seamless bottom fade overlay to blend athlete image into background */
    .hero-mask-overlay {
      background: linear-gradient(180deg, 
        rgba(18, 20, 17, 0) 0%, 
        rgba(18, 20, 17, 0.15) 45%, 
        rgba(18, 20, 17, 0.7) 75%, 
        #121411 98%
      );
    }

    /* Subtle top vignette for status bar readability */
    .top-scrim {
      background: linear-gradient(180deg, rgba(18, 20, 17, 0.75) 0%, rgba(18, 20, 17, 0) 100%);
    }
  </style>
</head>
<body class="bg-black text-white">
<!-- BEGIN: MobileDeviceContainer -->
<div class="mobile-frame" data-purpose="mobile-viewport-container">
<!-- BEGIN: AndroidStatusBar -->
<!-- Android standard status bar: 9:41, notification/wifi/battery indicators -->
<header class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-6 pt-3 pb-2 top-scrim select-none" data-purpose="status-bar">
<span class="text-[13px] font-semibold tracking-tight text-white/95">9:41</span>
<div class="flex items-center space-x-2 text-white/90">
<!-- Wi-Fi Icon -->
<svg aria-label="Wi-Fi Connected" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.5 0 6.69 1.4 9.04 3.68L12 19.34 2.96 11.18C5.31 8.9 8.5 7.5 12 7.5z"></path>
</svg>
<!-- Cell Signal Icon -->
<svg aria-label="Cellular Signal" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M2 22h20V2L2 22zm18-2H6.83L20 6.83V20z"></path>
</svg>
<!-- Battery Icon -->
<svg aria-label="Battery Level" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M16 4h-2V2h-4v2H8c-.55 0-1 .45-1 1v16c0 .55.45 1 1 1h8c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1zm-1 16H9V6h6v14z"></path>
</svg>
</div>
</header>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: TopBarActions -->
<!-- Top-right 'Skip' tap target aligned comfortably below the status bar -->
<div class="absolute top-8 right-3 z-30" data-purpose="top-navigation-action">

</div>
<!-- END: TopBarActions -->
<!-- BEGIN: HeroVisualSection -->
<!-- Cinematic athletic runner photography covering the upper ~65% with a bottom gradient fade -->
<section class="relative w-full h-[62%] overflow-hidden flex-shrink-0" data-purpose="hero-image-container">
<img alt="Atmospheric, cinematic, dynamic photograph of an athletic runner mid-stride at dusk or dawn, side-profile or three-quarter view, strong muscular motion and determination, modern dark moody aesthetic, deep charcoal and near-black background shadows, high quality editorial sports photography." class="w-full h-full object-cover object-center transform scale-[1.02]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBH7tDs0yl9o-Vhp-QYFlBzcgB3C-2XABPTfWPCRhHeKCocXRnul-rTP3gkd4PHLOMoTvHjxqolPaApiLuT7X3vJLkI5KZvnPScQkEGNGhkA-TDZ7gljoc39x267_0fWW1M-a8cUR5VEZVGN3qtd0Uk4gzSGp-NDBrQ2twQxN0zttX5n2zoQquX__ctK7CDfsv6fNuTb1V1fNl981U35Q2JbPEfQQu3LU82BNQkQXhQ-DGxXwVSZbX3">
<!-- Soft dark fade bridging smoothly into #121411 body background -->
<div aria-hidden="true" class="hero-mask-overlay absolute inset-0 pointer-events-none"></div>
</section>
<!-- END: HeroVisualSection -->
<!-- BEGIN: ContentAndActionsSection -->
<!-- Bottom structured section featuring headline, subtitle, pagination, and primary action -->
<main class="relative z-20 flex-1 flex flex-col justify-between px-7 pb-4 pt-1 bg-[#121411]" data-purpose="onboarding-copy-and-controls">
<!-- Primary Text Block -->
<div class="space-y-3" data-purpose="text-content">
<h1 class="text-[32px] font-bold leading-[1.15] tracking-[-0.03em] text-white">
          Train smarter.<br>Track every step.
        </h1>
<p class="text-[15px] leading-relaxed font-normal text-brand-textMuted tracking-normal">
          Log runs, rides and lifts, and watch your progress grow.
        </p>
</div>
<!-- Action Row: Indicators and CTA -->
<div class="flex items-center justify-between mt-8 mb-2" data-purpose="bottom-action-row">
<!-- Page Indicator Dots -->
<div aria-label="Onboarding Progress" class="flex items-center space-x-2" role="tablist">
<!-- Active dot: Lime rounded pill -->
<span aria-label="Slide 1 of 3 (Active)" aria-selected="true" class="w-6 h-1.5 rounded-full bg-brand-primary" role="tab"></span>
<!-- Inactive dot 1 -->
<span aria-label="Slide 2 of 3" aria-selected="false" class="w-1.5 h-1.5 rounded-full bg-brand-dotInactive" role="tab"></span>
<!-- Inactive dot 2 -->
<span aria-label="Slide 3 of 3" aria-selected="false" class="w-1.5 h-1.5 rounded-full bg-brand-dotInactive" role="tab"></span>
</div>
<!-- Primary Next Action Button -->
<button aria-label="Next slide" class="w-14 h-14 rounded-full bg-brand-primary flex items-center justify-center text-brand-darkIcon transition-transform active:scale-95 duration-150 focus:outline-none focus:ring-2 focus:ring-brand-primary focus:ring-offset-2 focus:ring-offset-[#121411] cursor-pointer" type="button">
<!-- Right Arrow SVG Icon -->
<svg aria-hidden="true" class="w-6 h-6 stroke-[2.4] stroke-current fill-none transform translate-x-0.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<line x1="5" x2="19" y1="12" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</button>
</div>
</main>
<!-- END: ContentAndActionsSection -->
<!-- BEGIN: AndroidGestureNavBar -->
<!-- Android gesture pill container anchored cleanly to bottom #121411 -->
<footer class="w-full h-6 bg-[#121411] flex items-center justify-center pb-2 select-none" data-purpose="gesture-nav-bar">
<div class="w-28 h-1 bg-white/30 rounded-full"></div>
</footer>
<!-- END: AndroidGestureNavBar -->
</div>
<!-- END: MobileDeviceContainer -->


</body></html>

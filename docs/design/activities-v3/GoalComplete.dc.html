<!doctype html>
<html lang="en">
<head>

<title>Goal complete</title>

<body>
<x-dc>
<helmet>

body{margin:0}
a{color:#111410}a:hover{color:#3A3F36}

</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111410; position: relative; overflow: hidden">

<div aria-hidden="{{open}}" style="box-sizing: border-box; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; gap: 4px">

</div>
<span style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #D4F26A; font-size: 14px; font-weight: 700">+ New goal</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px; border-radius: 26px; background: #1C1F1A; color: #FFFFFF">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 19px; font-weight: 700">Ride 100 km in 30 days</span>
<span><span style="font-size: 46px; font-weight: 800; letter-spacing: -0.02em">100</span><span style="font-size: 16px; color: #B4B9AE"> / 100 km</span></span>
</div>
<div style="position: relative; width: 104px; height: 104px">

<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #D4F26A">100%</span>
</div>
</div>
<div style="height: 98px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E6E0"></div>
<div style="height: 98px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E6E0"></div>
</div>

<div style="position: absolute; inset: 0; background: rgba(17, 20, 16, 0.62)"></div>

<span style="position: absolute; top: -46px; left: 50%; margin-left: -46px; width: 92px; height: 92px; box-sizing: border-box; border-radius: 999px; background: #D4F26A; border: 6px solid #FFFFFF; color: #111410; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg></span>

<p id="cel-body" style="margin: 0; font-size: 15px; line-height: 1.5; color: #555A50">Ride 100 km in 30 days, finished 4 days early.</p>
<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 4px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 6px; border-radius: 16px; background: #F5F6F2"><span style="font-size: 20px; font-weight: 800">100</span><span style="font-size: 12px; color: #6B7066">km ridden</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 6px; border-radius: 16px; background: #F5F6F2"><span style="font-size: 20px; font-weight: 800">26</span><span style="font-size: 12px; color: #6B7066">days taken</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 6px; border-radius: 16px; background: #1C1F1A; color: #FFFFFF"><span style="font-size: 20px; font-weight: 800; color: #D4F26A">2,700</span><span style="font-size: 12px; color: #B4B9AE">kcal burned</span></div>
</div>
<a href="NewGoal.dc.html" style="width: 100%; display: flex; align-items: center; justify-content: center; height: 54px; margin-top: 6px; border-radius: 999px; background: #D4F26A; color: #111410; font-size: 16px; font-weight: 800; text-decoration: none">Set a new goal</a>
<div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 48px; border-radius: 999px; border: 1px solid #D3D6CD; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #111410; cursor: pointer">Share</button>
<button type="button" onClick="{{close}}" style="height: 48px; border-radius: 999px; border: 0; background: #F1F3EC; font: inherit; font-size: 15px; font-weight: 700; color: #111410; cursor: pointer">Done</button>
</div>
</section>
</sc-if>

<sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{reopen}}" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #1C1F1A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Replay celebration</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var closed = !!(this.state && this.state.closed);
var self = this;
return {
open: !closed,
closed: closed,
close: function () { self.setState({ closed: true }); },
reopen: function () { self.setState({ closed: false }); }
};
}
}
</script>
</body>
</html>

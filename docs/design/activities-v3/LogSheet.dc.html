<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log a workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#111410}a:hover{color:#3A3F36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111410; position: relative; overflow: hidden">

<div aria-hidden="true" style="box-sizing: border-box; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7066">This week · 5 workouts</span>
<span style="font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">History</span>
<div style="height: 76px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E6E0"></div>
<div style="height: 76px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E6E0"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(17, 20, 16, 0.5)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 28px; border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D3D6CD"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="sheet-title" style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Log a workout</h2>
<p style="margin: 0; font-size: 14px; color: #6B7066">Swipe to choose an activity.</p>
</div>

<div role="group" aria-roledescription="carousel" aria-label="Activities" style="margin: 0 -20px; overflow: hidden">
<div style="display: flex; gap: 14px; transform: translateX({{tx}}px); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)">

<button type="button" aria-label="Running" aria-current="{{c0On}}" onClick="{{go0}}" style="flex: none; width: 250px; height: 270px; box-sizing: border-box; padding: 20px; border-radius: 26px; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 14px; transition: transform 0.35s, opacity 0.35s, background 0.35s; {{c0}}">
<span style="width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; {{i0}}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="4.5" r="2"></circle><path d="M8.5 20.5l2.5-5 3 2.5v4"></path><path d="M11 15.5l1.5-6"></path><path d="M12.5 9.5l-3.5 1-2 3"></path><path d="M12.5 9.5l2.5 3 3.5 1"></path></svg></span>
<span style="margin-top: auto; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Running</span>
<span style="font-size: 14px; line-height: 1.4; {{t0}}">Outdoor runs with a live map</span>
</button>

<button type="button" aria-label="Cycling" aria-current="{{c1On}}" onClick="{{go1}}" style="flex: none; width: 250px; height: 270px; box-sizing: border-box; padding: 20px; border-radius: 26px; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 14px; transition: transform 0.35s, opacity 0.35s, background 0.35s; {{c1}}">
<span style="width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; {{i1}}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg></span>
<span style="margin-top: auto; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Cycling</span>
<span style="font-size: 14px; line-height: 1.4; {{t1}}">Rides with live speed and route</span>
</button>

<button type="button" aria-label="Swimming" aria-current="{{c2On}}" onClick="{{go2}}" style="flex: none; width: 250px; height: 270px; box-sizing: border-box; padding: 20px; border-radius: 26px; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 14px; transition: transform 0.35s, opacity 0.35s, background 0.35s; {{c2}}">
<span style="width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; {{i2}}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="6" r="2"></circle><path d="M4 12.5l4.5-3.5 3 3 4.5-2"></path><path d="M2 17c1.7 0 2.3-1 4-1s2.3 1 4 1 2.3-1 4-1 2.3 1 4 1 2.3-1 4-1"></path><path d="M2 21c1.7 0 2.3-1 4-1s2.3 1 4 1 2.3-1 4-1 2.3 1 4 1 2.3-1 4-1"></path></svg></span>
<span style="margin-top: auto; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Swimming</span>
<span style="font-size: 14px; line-height: 1.4; {{t2}}">Pool laps or open water</span>
</button>

<button type="button" aria-label="Rowing" aria-current="{{c3On}}" onClick="{{go3}}" style="flex: none; width: 250px; height: 270px; box-sizing: border-box; padding: 20px; border-radius: 26px; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 14px; transition: transform 0.35s, opacity 0.35s, background 0.35s; {{c3}}">
<span style="width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; {{i3}}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="5" r="2"></circle><path d="M10 7.5l1.5 4.5h4"></path><path d="M3 15h18l-2.5 4h-13z"></path><path d="M5 8.5l13.5 13"></path></svg></span>
<span style="margin-top: auto; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Rowing</span>
<span style="font-size: 14px; line-height: 1.4; {{t3}}">On the water or a rowing machine</span>
</button>

<button type="button" aria-label="Workout" aria-current="{{c4On}}" onClick="{{go4}}" style="flex: none; width: 250px; height: 270px; box-sizing: border-box; padding: 20px; border-radius: 26px; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 14px; transition: transform 0.35s, opacity 0.35s, background 0.35s; {{c4}}">
<span style="width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; {{i4}}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="m21.5 21.5-1.4-1.4"></path><path d="M3.9 3.9 2.5 2.5"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></svg></span>
<span style="margin-top: auto; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Workout</span>
<span style="font-size: 14px; line-height: 1.4; {{t4}}">Sets, reps and weight</span>
</button>

</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Previous activity" onClick="{{prev}}" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #E4E6E0; background: #FFFFFF; color: #111410; display: flex; align-items: center; justify-content: center; cursor: pointer; {{prevStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
<span style="height: 8px; border-radius: 999px; transition: width 0.3s; {{d0}}"></span>
<span style="height: 8px; border-radius: 999px; transition: width 0.3s; {{d1}}"></span>
<span style="height: 8px; border-radius: 999px; transition: width 0.3s; {{d2}}"></span>
<span style="height: 8px; border-radius: 999px; transition: width 0.3s; {{d3}}"></span>
<span style="height: 8px; border-radius: 999px; transition: width 0.3s; {{d4}}"></span>
</div>
<button type="button" aria-label="Next activity" onClick="{{next}}" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #E4E6E0; background: #FFFFFF; color: #111410; display: flex; align-items: center; justify-content: center; cursor: pointer; {{nextStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>

<sc-if value="{{gps}}" hint-placeholder-val="{{ false }}">
<div role="radiogroup" aria-label="How to log" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 999px; background: #F5F6F2; border: 1px solid #E4E6E0">
<button type="button" role="radio" aria-checked="{{liveOn}}" onClick="{{pickLive}}" style="height: 40px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; {{liveStyle}}">Live with GPS</button>
<button type="button" role="radio" aria-checked="{{manOn}}" onClick="{{pickMan}}" style="height: 40px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; {{manStyle}}">Add manually</button>
</div>
</sc-if>
<sc-if value="{{noGps}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; min-height: 52px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; line-height: 1.45; color: #6B7066">{{noGpsNote}}</p>
</sc-if>

<sc-if value="{{isSwim}}" hint-placeholder-val="{{ true }}">
<a href="LogSwim.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #D4F26A; color: #111410; font-size: 16px; font-weight: 800; text-decoration: none">{{cta}}</a>
</sc-if>
<sc-if value="{{notSwim}}" hint-placeholder-val="{{ false }}">
<button type="button" style="height: 56px; border-radius: 999px; border: 0; background: #D4F26A; font: inherit; font-size: 16px; font-weight: 800; color: #111410; cursor: pointer">{{cta}}</button>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var s = Object.assign({ i: 2, live: true }, this.state || {});
var i = s.i;
var A = [
{ k: 'run', gps: true, live: 'Start run with GPS', man: 'Add a run manually' },
{ k: 'ride', gps: true, live: 'Start ride with GPS', man: 'Add a ride manually' },
{ k: 'swim', gps: false, cta: 'Add a swim', note: 'GPS does not work under water, so swims are added after the session.' },
{ k: 'row', gps: true, live: 'Start row with GPS', man: 'Add a row manually' },
{ k: 'lift', gps: false, cta: 'Log a workout', note: 'Add exercises, sets and reps as you go.' }
];
var cur = A[i];
var on = 'background: #1C1F1A; color: #FFFFFF; border: 1px solid #1C1F1A; transform: scale(1); opacity: 1';
var off = 'background: #FFFFFF; color: #111410; border: 1px solid #E4E6E0; transform: scale(0.9); opacity: 0.7';
var segOn = 'background: #121411; color: #FFFFFF';
var segOff = 'background: transparent; color: #111410';
var v = {
tx: 70 - i * 264,
gps: cur.gps, noGps: !cur.gps,
noGpsNote: cur.note || '',
isSwim: cur.k === 'swim', notSwim: cur.k !== 'swim',
cta: cur.gps ? (s.live ? cur.live : cur.man) : cur.cta,
liveOn: s.live ? 'true' : 'false', manOn: s.live ? 'false' : 'true',
liveStyle: s.live ? segOn : segOff, manStyle: s.live ? segOff : segOn,
pickLive: function () { self.setState({ live: true }); },
pickMan: function () { self.setState({ live: false }); },
prev: function () { self.setState({ i: Math.max(0, i - 1) }); },
next: function () { self.setState({ i: Math.min(4, i + 1) }); },
prevStyle: i === 0 ? 'opacity: 0.35' : 'opacity: 1',
nextStyle: i === 4 ? 'opacity: 0.35' : 'opacity: 1'
};
for (var n = 0; n < 5; n++) {
(function (n) {
var sel = n === i;
v['c' + n] = sel ? on : off;
v['c' + n + 'On'] = sel ? 'true' : 'false';
v['i' + n] = sel ? 'background: #D4F26A; color: #111410' : 'background: #F1F3EC; color: #111410';
v['t' + n] = sel ? 'color: #B4B9AE' : 'color: #6B7066';
v['d' + n] = sel ? 'width: 22px; background: #111410' : 'width: 8px; background: #D3D6CD';
v['go' + n] = function () { self.setState({ i: n }); };
})(n);
}
return v;
}
}
</script>
</body>
</html>
